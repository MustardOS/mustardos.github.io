description: >
  The Wi-Fi Network module lists every network profile you have saved, showing whether each one connects
  automatically along with its priority, or only connects when selected manually. Selecting a profile opens it for
  editing, where you can update its details or connect to it directly.<br><br>Press <strong>L</strong> or
  <strong>R</strong> on a profile to toggle Auto Connect on or off, <strong>X</strong> to scan for nearby networks,
  and <strong>Y</strong> to set up a brand new profile from scratch.

goback: muxconnect

visible:
  - name: Network Profile
    icon: profile
    link: muxnetprofile
    desc: >
      Each saved Wi-Fi network appears here as a profile, alongside its current status such as
      <code>Connected - Auto (3)</code> or <code>Manual</code>. Press <strong>A</strong> to open a profile and edit
      its details or connect to it.
  - name: Wired Ethernet Connection
    icon: ethernet
    link: muxnetprofile
    desc: >
      On devices that connect with a network cable, this single row replaces the Wi-Fi profiles. Press
      <strong>A</strong> to configure it: <strong>DHCP</strong> obtains the network details automatically, while
      <strong>Static</strong> lets you set the device address, subnet, gateway and DNS server yourself.

hidden:
  - name: Scan for Networks
    link: muxnetscan
    desc: >
      Press <strong>X</strong> to search for nearby Wi-Fi networks and continue setting one up as a new profile
      directly from the scan results.
  - name: New Profile
    link: muxnetprofile
    desc: >
      Press <strong>Y</strong> to clear the form and set up a new network profile.

tip:
  - info: Profiles set to **Auto Connect** are attempted in priority order (1 highest, 9 lowest) whenever the device starts up or wakes; profiles set to **Manual** only connect when you select them yourself.
