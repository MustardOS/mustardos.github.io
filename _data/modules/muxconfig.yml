description: >
  Set up the device, its interface, connectivity, cores, power, storage, and backups. Each area has its own focused
  screen, and larger screens are divided into sections.

goback: muxlaunch

visible:
  - name: General
    icon: general
    link: muxtweakgen
    desc: >
      Change device specific settings, date and time, brightness and volume, hotkeys and device startup.
      <br><br>Press <strong>X</strong> here to jump straight to <strong>Advanced</strong>, or hold
      <strong>Y</strong> for the <strong>Danger</strong> settings beneath it. Both ask you to confirm first.
  - name: Customisation
    icon: custom
    link: muxcustom
    desc: >
      Everything that decides how your device looks, sounds, and presents your content, arranged into sections. The
      header bar, fonts, folders, box art, themes, and audio all live here, along with catalogue
      sets, RetroArch configurations, and your boot logo.
  - name: Connectivity
    icon: connect
    link: muxconnect
    desc: >
      A central module to connect to Wi-Fi networks and change device specific network settings. 
      A number of web services can also be enabled from here and device specific USB functionality.
  - name: Profiles
    icon: access
    link: muxprofile
    desc: >
      Apply a group of settings in one step, including ready-made accessibility profiles for larger text, stronger
      contrast, a clearer highlight and calmer movement. You can also save your own settings as a profile to keep or
      share.
  - name: Cores
    icon: core
    link: muxcore
    desc: >
      See every published Libretro core, check which builds are installed, and install or update them directly on
      the device.
  - name: Power
    icon: power
    link: muxpower
    desc: >
      Modify the sleep functionality, low battery indicator, and idle input modes. 
      Idle and default system governors can also be changed within this module.
  - name: Storage
    icon: storage
    link: muxstorage
    desc: >
      Supported devices with an additional mSD slot will allow you to store specific items on a secondary card.
  - name: Backup
    icon: backup
    link: muxbackup
    desc: >
      A great module to use if you are updating or wanting to share various configurations with another device. 
      Create either individual backups or merge into one big archive for convenience.
