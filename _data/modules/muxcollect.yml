description: >
  The Collection module allows you to organise and group your favourite content into personalised sets. Folders can 
  be created to sort collections by theme, genre, or platform, while individual items can be freely combined across 
  systems.<br><br>It provides an easy and flexible way to curate and access the content you enjoy most.

goback: muxlaunch

visible:
  - name: Collection Folder
    icon: folder
    desc: >
      Create one level deep folders to keep your collection organised.
  - name: Collection Item
    icon: collection
    desc: >
      An item that has been collected and stored. Items with the same name can be stored together, 
      along with items from different systems and cores.

hidden:
  - name: Information
    desc: >
      Hold <strong>MENU</strong> on an item to open its Information straight away, or choose
      <strong>Information</strong> from the actions list. It opens on the preview artwork when the item has some,
      which can be a picture or a short video, and on the description otherwise. Press <strong>A</strong> to switch
      between the two.
