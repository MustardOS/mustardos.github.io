description: >
  The Power Settings module allows you to control how MustardOS manages power, performance, and idle behaviour. These 
  settings define what happens when the device is left inactive, reaches low battery levels, or enters sleep mode. 
  <br><br>You are also able to switch how the CPU behaves under normal and idle conditions, helping balance performance
  with battery life.

goback: muxconfig

visible:
  - name: Sleep Function
    icon: shutdown
    desc: >
      What a short press of the power button does. <strong>Sleep Until Wake</strong> sleeps until the power button
      is pressed again, <strong>Instant Shutdown</strong> turns the device off, and the timed choices sleep first and
      then shut down if the device has not been woken in that time. <strong>Disabled</strong> does nothing. Holding
      the button down always shuts the device off.
  - name: Low Battery Indicator
    icon: battery
    desc: >
      Toggles the LED/RGB light behaviour when the battery reaches a critically low level.
  - name: Idle Input Sleep Timeout
    icon: idle_sleep
    desc: >
      Sets how long the device remains idle before automatically entering sleep mode.
  - name: Idle Input Display Timeout
    icon: idle_display
    desc: >
      Defines the duration of inactivity before the display automatically turns off to conserve energy.
  - name: Mute on Display Timeout
    icon: idle_mute
    desc: >
      Automatically mutes system audio when the display turns off due to inactivity.
  - name: Idle Governor
    icon: gov_idle
    desc: >
      Determines which CPU governor is applied during the idle display timeout.
  - name: Default Governor
    icon: gov_default
    desc: >
      Sets the CPU governor used during normal device operation.
  - name: Screensaver Type
    icon: saver_type
    desc: >
      Choose which frontend screensaver is shown once the idle display timeout is reached, or disable it entirely.
  - name: Screensaver Speed
    icon: saver_speed
    desc: >
      Adjust how quickly the frontend screensaver animates once it is active.

tip:
  - info: On the Anbernic H700 devices (the RG28XX, RG34XX, RG35XX and RG40XX families, the RG CubeXX and the RGSP), **Sleep Until Wake** uses the deepest standby the hardware has. Only the memory stays powered, and the power button is the only thing that wakes it, so it uses far less battery than the timed choices. Plugging in a charger does not wake it. The timed choices keep an alarm armed so the device can shut itself down later, which needs the lighter standby.
