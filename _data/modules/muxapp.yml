description: >
  Everything that is not a game. Emulators, utilities, and the odd bit of fun, all in one list.<br><br>The three
  most useful tools are now pinned to the top of the list so they are always in the same place, with everything
  else following alphabetically underneath. <a href="https://community.muos.dev/c/application/20">More applications
  can be found here.</a>

goback: muxlaunch

visible:
  - name: Archive Manager
    icon: archive
    link: muxarchive
    desc: >
      Pinned to the top. Applications, system updates, and anything else installable arrives through here. See
      <a href="https://community.muos.dev/t/manually-creating-installable-archives/824">manually creating
      installable archives</a> if you would like to build your own.
  - name: Task Toolkit
    icon: task
    link: muxtask
    desc: >
      Pinned to the top. A collection of handy scripts covering diagnostics, clearing caches, restoring data, and
      safely mounting or unmounting your cards and USB storage.
  - name: vTree Gold
    icon: vtree
    desc: >
      Pinned to the top. A proper file manager driven entirely by your gamepad, with one or two panes, copy and
      paste, renaming, text and image viewers, and themes of its own. <em>It can reach every corner of the system,
      so do tread carefully.</em>
  - name: 2048 Plus
    icon: logo_2048
    desc: >
      The sliding number puzzle, for when you have five minutes and no particular plan.
  - name: Mustard Terminal
    icon: terminal
    link: muxterm
    desc: >
      A terminal for those occasions when nothing else will do. <em>Best left alone unless you know what you are
      typing.</em>
  - name: PortMaster
    icon: portmaster
    desc: >
      A whole world of games and applications built for Linux handhelds. Ports and their updates are installed
      through here.
  - name: PPSSPP
    icon: ppsspp
    desc: >
      A PSP emulator, capable of running things rather more crisply than the original hardware ever managed.
  - name: RetroArch
    icon: retroarch
    desc: >
      The frontend for emulators, game engines, and media players that runs a great deal of your library.
  - name: ScummVM
    icon: scummvm
    desc: >
      <a href="https://www.scummvm.org">Script Creation Utility for Maniac Mansion Virtual Machine</a>, which runs
      the classic point and click adventures and role playing games, <em>provided you already have their data
      files</em>.

hidden:
  - name: Application Information
    desc: >
      Press <strong>MENU</strong> on an application to read what it does. Applications supply their own description,
      so what you see comes from its creator.

tip:
  - info: Archive Manager, Task Toolkit, and vTree Gold always sit at the top of the list, no matter how much else you install.
