description: >
  Choose how selected content launches. Core Assignment first narrows the list by namespace and system, then shows
  the compatible Pickles, RetroArch, and external choices installed on your device. It opens automatically when
  content has no assignment, and can also be opened from Content Options.

goback: muxoption

visible:
  - name: Namespace
    icon: system
    desc: >
      Choose the broad group for the content, such as a home console, handheld, arcade system, or computer. This
      keeps the system list short and easy to browse.
  - name: System
    icon: system
    desc: >
      Choose the system the content belongs to. Only compatible installed choices are shown on the next screen.
  - name: Core
    icon: core
    desc: >
      Choose an installed core or external launcher. Pickles and RetroArch variants are kept together so each
      implementation is easy to find. Press <strong>Left</strong> or <strong>Right</strong> to change the runtime
      where more than one is available.
  - name: Assignment Scope
    icon: default
    desc: >
      Apply the choice to the selected content, the current directory, or the current directory and its
      subdirectories. You can also leave existing assignments unchanged.

tip:
  - info: Use a content assignment for a game that needs a different core. Use a directory assignment when a whole system should launch the same way.
  - info: Core Management in Configuration installs and updates the Libretro cores available here.
  - info: Many more systems and cores are hidden to keep these lists short. Enable Additional Cores in Advanced to show them.
