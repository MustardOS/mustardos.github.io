description: >
  Settings for a single application. At the moment that covers how hard the
  processor is allowed to work while the application is running, and which control scheme it uses.<br><br>Anything
  set here affects only the application named at the top.

goback: muxapp

visible:
  - name: Name
    icon: app
    desc: >
      The application you are currently setting up.
  - name: Governor
    icon: governor
    desc: >
      How the processor behaves while this application is running, whether keeping things calm and cool or letting
      it stretch its legs.
  - name: Control Scheme
    icon: control
    desc: >
      Which control scheme is applied when this application launches, handy when one of them expects the buttons
      arranged differently.
