description: >
  Manually adjust the system clock and calendar settings used with the frontend, emulators, and applications alike. 
  These controls ensure accurate timestamps for files, logs, and saved data even without network access.

goback: muxtweakgen

visible:
  - name: Timezone
    icon: timezone
    link: muxtimezone
    desc: >
      Opens the Timezone selection module, where you can set the correct regional timezone for your country or area. 
      Ensures automatic adjustment for daylight saving time and proper alignment with your local region.
  - name: Year
    icon: year
    desc: >
      Adjusts the current system year.
  - name: Month
    icon: month
    desc: >
      Changes the system month value.
  - name: Day
    icon: day
    desc: >
      Sets the current calendar day.
  - name: Hour
    icon: hour
    desc: >
      Adjusts the system clock hour value.
  - name: Minute
    icon: minute
    desc: >
      Sets the minute portion of the system time.
  - name: Time Notation
    icon: notation
    desc: >
      Switch between 12 hour and 24 hour time formats. This setting changes how time is displayed in the frontend.
  - name: Custom Format
    icon: custom
    desc: >
      Write your own layout for the clock, so it reads exactly how you like, whether that is a plain
      <strong>14:05</strong>, a fuller <strong>Sun 2 Aug, 2:05 pm</strong>, or something in between. Only
      used when Time Notation is set to use it.

tip:
  - info: Press **MENU** on any row for a short explanation of that setting, including the format codes for Custom Format.
