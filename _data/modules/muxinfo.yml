description: >
  Everything your device has to tell you, gathered in one place. Check the system and battery, storage space,
  network details, activity, screenshots, community news, and the software included in the release.

goback: muxlaunch

visible:
  - name: Community News
    icon: news
    link: muxnews
    desc: >
      Announcements, feature highlights, and news from the community, gathered from the
      <a href="https://community.muos.dev">MustardOS Community Forum</a> so you can keep up with what is happening
      without leaving your device.
  - name: Activity Tracker
    icon: activity
    link: muxactivity
    desc: >
      A look at how you have actually been playing. Play time, how often you come back to things, your play styles,
      and how it all adds up over the months.
  - name: Screenshots
    icon: screenshot
    link: muxshot
    desc: >
      Screenshots taken with the MustardOS screenshot hotkey. RetroArch screenshots and other pictures are not
      shown here.
  - name: Storage Space
    icon: space
    link: muxspace
    desc: >
      How much room is used and how much is left on every card and drive attached, including the space MustardOS
      itself lives in.
  - name: Input Tester
    icon: tester
    link: muxtester
    desc: >
      A quick way to check every button, stick, and trigger is doing what it should. Worth a visit if something
      feels off.
  - name: Device Details
    icon: detail
    link: muxdetail
    desc: >
      Everything about your device in one screen, split into sections covering the system itself, how it is
      running, the processor, the battery, and the network.
  - name: Supporters and Credits
    icon: credit
    desc: >
      The developers, supporters, and contributors who make MustardOS what it is, with some rather good music to
      watch it go by.
  - name: Reload Frontend
    icon: reload
    desc: >
      Restarts the frontend so it picks up any settings or theme changes made outside of the interface.
  - name: Third Party
    icon: third
    link: muxthird
    desc: >
      An alphabetical list of the third-party libraries included in this release, together with their exact versions.
