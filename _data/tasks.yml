      path: "Export Collection to HTML.sh"
      icon: "star"
      mode: "progress"
      cancel: false
      desc: "Writes your collections, with box art where it is found, to a collection.html page at the root of SD1. The active theme can supply its own page layout."
    - name: "Refresh Automatic Core Assign"
      path: "Refresh Automatic Core Assign.sh"
      icon: "junk"
      mode: "progress"
      cancel: false
      desc: "Rebuilds the automatic core assignments for recognised folder names, which helps after adding folders or updating the core manifests."
    - name: "Refresh Bootlogo"
      path: "Refresh Bootlogo.sh"
      icon: "theme"
      mode: "progress"
      cancel: false
      desc: "Rebuilds the boot logo and charging image from your chosen boot logo or the active theme."
    - name: "Replay Tour Introduction"
      path: "Replay Tour Introduction.sh"
      icon: "star"
      mode: "progress"
      cancel: false
      desc: "Show the introduction on every menu again, as it appeared the first time you used the device."
    - name: "System Diagnostics"
      path: "System Diagnostics.sh"
      icon: "diagnostic"
      mode: "progress"
      cancel: false
      desc: "Creates a ZIP file on SD1 with logs and system details to send to the MustardOS crew when asking for help."
