      path: "Dot and Junk File Cleanup.sh"
      icon: "junk"
      mode: "progress"
      cancel: false
      desc: "Removes junk left behind by other computers, such as macOS dot files and Windows System Volume Information folders, from SD1, SD2 and USB storage."
