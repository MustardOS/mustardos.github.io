important:
  - Backups are now <code>.muxbak</code> files saved in the <code>ARCHIVE</code> folder, and the <code>BACKUP</code>
    folder is no longer used. Each backup carries a checksum manifest that is checked before anything is restored, and
    pressing <strong>MENU</strong> on one in the Archive Manager shows what it holds. If a backup or install fails, a
    log is saved to <code>MUOS/log</code> on SD1.
  - Older <code>.muxzip</code> backups are not checked, but most still install once copied from <code>BACKUP</code>
    into <code>ARCHIVE</code>. Backups made on test builds between 7 and 16 October that included MustardOS Settings
    saved every section after it empty, so those sections cannot be restored. Make a fresh backup once you are set up.

note:
  - Themes are now stored as open folders instead of compressed archives (previously extracted to the <code>active</code> folder).
    This enables faster theme switching, alternate theme changes, and restores random theme selection on device start.
    Existing <code>.muxthm</code> theme files in <code>MUOS/theme</code> must be extracted manually.
  - The external FreeJ2ME launchers have been removed. J2ME content assigned to them should be assigned to the FreeJ2ME
    core, which now runs in Pickles.
  - Cores that cannot run without a BIOS now stop at launch and list the files they need. Sega Saturn now defaults to
    Yabadabadoo, which needs <code>saturn_bios.bin</code>, <code>sega_101.bin</code> or <code>mpr-17933.bin</code> in
    the BIOS folder.

summary: >
  Andromeda is one of the biggest MustardOS releases to date, with well over a thousand recorded changes across the
  frontend, Pickles, themes and system scripts. The highlights below cover the most notable additions, and the
  recorded changes are available at the end of this page.

highlights:
  - title: Pickles
    icon: muxretro/settings
    desc: >
      Our own Libretro player gains Network Play, RetroAchievements, cheats, overlays, colour filters, controller and
      port remapping, turbo, suspend and resume, and a detailed performance monitor.
  - title: Wasabi
    icon: muxmedia/wasabi
    desc: >
      Our integrated media player for video, music, playlists, live television and live radio, with bookmarks, an
      equaliser, visualisers and shaders inside the familiar MustardOS theme.
  - title: Themes and Fonts
    icon: muxconfig/theme
    desc: >
      Themes are stored as open folders for faster switching, with 1920x1080 support, alternative colour files, a font
      picker, font shadows and boot logo management.
  - title: Screensavers
    icon: muxpower/saver_type
    desc: >
      New screensavers including date and time, flying box art, an image slideshow and a blue screen, each with a
      preview mode in the power settings.
  - title: Content and Collections
    icon: muxlaunch/explore
    desc: >
      Content explorer forward history, collection and history actions, per content options, video previews and
      catalogue support for SVG artwork and text manuals.
  - title: Device and System
    icon: muxconfig/general
    desc: >
      Bluetooth support, first time orientation with a tour of every screen, an activity tracker, passcode settings,
      bulk storage tools and configurable ports for each Web Service.

